<ion-app>
  <!-- Hamburger Side Menu -->
  <ion-menu contentId="main-content" menuId="main-menu" side="start" *ngIf="user"
    (ionDidOpen)="onMenuOpen()" (ionDidClose)="onMenuClose()">
    <ion-header>
      <ion-toolbar class="liquid-glass-header">
        <ion-title>Portal Menu</ion-title>
      </ion-toolbar>
    </ion-header>
    
    <ion-content class="ion-padding content-bg menu-content">
      <!-- User Profile Card -->
      <div class="menu-user-profile liquid-glass ion-padding ion-margin-bottom">
        <div class="avatar-small" style="font-weight: 800; font-size: 16px; background: rgba(235, 132, 85, 0.15); color: #D45520;">
          {{ getInitials(user.username) }}
        </div>
        <div class="user-info">
          <h4>{{ user.username }}</h4>
          <p>{{ user.email }}</p>
          <span class="role-badge" [class]="user.role" style="font-size: 8px; text-transform: uppercase; font-weight: 800; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 4px;">
            {{ user.role }}
          </span>
        </div>
      </div>
      
      <!-- Navigation Items -->
      <ion-list lines="none" class="menu-list">
        <ion-menu-toggle auto-hide="false">
          <ion-item button routerLink="/tabs/dashboard" detail="false" class="menu-item-card" *ngIf="user.role !== 'admin'">
            <ion-icon name="camera-outline" slot="start"></ion-icon>
            <ion-label>Receive Packages</ion-label>
          </ion-item>
          <ion-item button routerLink="/tabs/ledger" detail="false" class="menu-item-card">
            <ion-icon name="list-outline" slot="start"></ion-icon>
            <ion-label>Activity Ledger</ion-label>
          </ion-item>
          <ion-item button routerLink="/tabs/profile" detail="false" class="menu-item-card">
            <ion-icon name="person-outline" slot="start"></ion-icon>
            <ion-label>My Profile</ion-label>
          </ion-item>
          <ion-item button routerLink="/tabs/staff" detail="false" class="menu-item-card" *ngIf="user.role !== 'user'">
            <ion-icon name="people-outline" slot="start"></ion-icon>
            <ion-label>Staff Directory</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>

      <!-- Spacer pushes logout to bottom -->
      <div class="menu-spacer"></div>

      <!-- Logout at bottom -->
      <div class="menu-divider"></div>
      <ion-list lines="none" class="menu-list menu-logout-list">
        <ion-item button (click)="logout()" class="logout-menu-item">
          <ion-icon name="log-out-outline" slot="start" color="danger"></ion-icon>
          <ion-label color="danger">Log Out</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>

  <!-- Blur overlay when menu is open -->
  <div class="menu-backdrop-blur" [class.active]="menuOpen"></div>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
