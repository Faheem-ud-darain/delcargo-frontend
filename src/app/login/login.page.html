<ion-content [fullscreen]="true" class="ion-padding login-bg">
  <div class="login-container liquid-glass">
    <div class="logo-area ion-text-center">
      <div class="logo-box">
        <ion-icon name="cube-outline" class="logo-icon"></ion-icon>
      </div>
      <h1 class="brand-title">DelCargo Us</h1>
      <p class="brand-subtitle">Warehouse Receiving Portal</p>
    </div>

    <form (ngSubmit)="onLogin()" class="login-form">
      <ion-item lines="none" class="glass-input-item">
        <ion-icon name="mail-outline" slot="start" class="input-icon"></ion-icon>
        <ion-input
          type="email"
          placeholder="Email address"
          name="email"
          [(ngModel)]="email"
          required
        ></ion-input>
      </ion-item>

      <ion-item lines="none" class="glass-input-item ion-margin-top">
        <ion-icon name="lock-closed-outline" slot="start" class="input-icon"></ion-icon>
        <ion-input
          type="password"
          placeholder="Password"
          name="password"
          [(ngModel)]="password"
          required
        ></ion-input>
      </ion-item>

      <div *ngIf="errorMessage" class="error-banner">
        <ion-icon name="alert-circle-outline"></ion-icon>
        <span>{{ errorMessage }}</span>
      </div>

      <button type="submit" class="primary-liquid-button login-btn" [disabled]="isLoading">
        <span *ngIf="!isLoading">Log In</span>
        <ion-spinner *ngIf="isLoading" name="crescent" color="light"></ion-spinner>
      </button>
    </form>

    <div class="quick-links">
      <div class="divider">
        <span>DEMO QUICK LOGINS</span>
      </div>
      
      <div class="quick-btn-grid">
        <button (click)="quickLogin('user@warehouse.com')" class="quick-login-btn">
          <ion-icon name="person-outline"></ion-icon>
          <div>
            <strong>Staff User</strong>
            <span>W01 - Seattle</span>
          </div>
        </button>

        <button (click)="quickLogin('manager@warehouse.com')" class="quick-login-btn">
          <ion-icon name="briefcase-outline"></ion-icon>
          <div>
            <strong>Manager</strong>
            <span>W01 - Seattle</span>
          </div>
        </button>

        <button (click)="quickLogin('admin@delcargo.com')" class="quick-login-btn">
          <ion-icon name="shield-checkmark-outline"></ion-icon>
          <div>
            <strong>Admin Owner</strong>
            <span>All Warehouses</span>
          </div>
        </button>
      </div>
    </div>
  </div>
</ion-content>
